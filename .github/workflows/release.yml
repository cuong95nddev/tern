# Push a tag like v0.1.0 to build a universal macOS DMG, a Windows installer
# and a Linux archive and publish them as a GitHub release (the tag must
# match the version in Cargo.toml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macOS 26: Xcode 26's actool crashes on macOS 15 (its asset agent dies
    # on a missing AVFCore symbol) when compiling the Icon Composer icon.
    runs-on: macos-26
    steps:
      # Fail before the long build rather than at publish: without the token
      # the release would fall back to github.token, which cannot write there.
      - name: Check release repo settings
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ -n "$RELEASE_REPO" ] && [ "$HAS_TOKEN" != true ]; then
            echo "::error::RELEASE_REPO is $RELEASE_REPO but the RELEASE_TOKEN secret is missing"; exit 1
          fi
          echo "Releases and update checks: ${RELEASE_REPO:-$GITHUB_REPOSITORY}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      # Signing and notarization run only when the secrets are set (see
      # README); without them the DMG holds an ad-hoc signed app.
      - name: Import signing certificate and notary key
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          [ -n "$CERT_P12" ] || { echo "no signing secrets: ad-hoc build"; exit 0; }
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "TERN_SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials tern-notary --keychain "$KC" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            rm "$RUNNER_TEMP/notary.p8"
            echo "TERN_NOTARY_PROFILE=tern-notary" >> "$GITHUB_ENV"
            echo "TERN_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          fi
      # Pin actool to the newest Xcode 26 rather than whatever is default, so
      # the Icon Composer icon compiles (else macOS 26 shows a gray tile).
      - name: Find Xcode 26 for the app icon
        run: |
          x=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          [ -n "$x" ] || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          echo "Compiling the icon with $x"
          echo "TERN_ICON_XCODE=$x" >> "$GITHUB_ENV"
      - name: Build DMG
        id: dmg
        env:
          TERN_REQUIRE_ICON: "1"
          # The repo the app checks for updates (see the publish job).
          TERN_RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        # An assignment, not `echo "path=$(…)"`: echo's status would hide
        # the script failing, leaving the upload an empty path.
        run: |
          dmg=$(scripts/release-macos.sh dist)
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tern-macos
          path: ${{ steps.dmg.outputs.path }}

  # 0.2.1 is released for macOS only: Windows and Linux don't build until the
  # daemon is ported (branch daemon-all-platforms). Revert this after it merges.
  windows:
    if: false
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      # Code signing through SignPath (free for open source, certificate by
      # SignPath Foundation) once the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set:
      # tern.exe is signed, packed into the installer, and the installer is
      # signed. Each request waits for a manual approval in SignPath.
      # Without them the installer is built unsigned, as before.
      - name: Build tern.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        env:
          TERN_RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TERN_WINDOWS_SIGNER: ${{ vars.WINDOWS_SIGNER }}
        run: |
          cargo build --locked --release -p tern-app --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\tern-app.exe unsigned\tern.exe
      - name: Upload unsigned tern.exe
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tern-exe-unsigned
          path: unsigned/tern.exe
      - name: Sign tern.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tern' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: tern-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Build installer
        id: setup
        env:
          TERN_RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          # Thumbprints of the installer's signing certificates; Tern installs
          # updates only when set (and the installer is signed by one).
          TERN_WINDOWS_SIGNER: ${{ vars.WINDOWS_SIGNER }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          if ($env:SIGNED -eq "true") {
            $setup = scripts/release-windows.ps1 -OutDir dist -Exe signed\tern.exe
          } else {
            $setup = scripts/release-windows.ps1 -OutDir dist
          }
          "path=$setup" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer
        id: unsigned-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tern-setup-unsigned
          path: ${{ steps.setup.outputs.path }}
      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'tern' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: tern-setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-setup
      - name: Check signatures
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          foreach ($f in @("signed\tern.exe") + (Get-ChildItem signed-setup\*-setup.exe).FullName) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if ($s.Status -ne "Valid") { throw "$f is not signed: $($s.Status)" }
            "$f signed by $($s.SignerCertificate.Subject) ($($s.SignerCertificate.Thumbprint))"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tern-windows
          path: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed-setup/*-setup.exe' || steps.setup.outputs.path }}

  linux:
    if: false
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
      - name: Install GPUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y $(cat packaging/linux/build-deps.txt)
      - name: Build archive
        id: tar
        env:
          TERN_RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          tar=$(scripts/release-linux.sh dist)
          echo "path=$tar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tern-linux
          path: ${{ steps.tar.outputs.path }}

  publish:
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tern-*
          merge-multiple: true
          path: dist
      # With the repository variable RELEASE_REPO (e.g. a public repo, so the
      # app can check for updates while this one is private) the release is
      # published there, using RELEASE_TOKEN: a fine-grained token with
      # Contents read/write on that repo.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.tar.gz
          generate_release_notes: ${{ !vars.RELEASE_REPO }}
          # v1.2.3-rc1: a prerelease, which /releases/latest (the update
          # check) skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install (macOS 12+, Apple Silicon and Intel)

            1. Open the DMG and drag **Tern** onto **Applications**.
            2. Optional `tern` command: put this in `~/.local/bin/tern` and `chmod +x` it:
               ```sh
               #!/bin/sh
               dir=$(cd "${1:-.}" && pwd) || exit 1
               exec open -a Tern "$dir"
               ```

            This release is macOS only; Windows and Linux follow in the next one.

