# Lint, test and build on every platform Tern ships for.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install GPUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $(cat packaging/linux/build-deps.txt)
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Every crate's tests, each failure also as an annotation.
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "^test .* FAILED$|panicked at" test.log | head -40 | sed 's/^/::error::/'
          grep -A3 "panicked at" test.log | grep -vE "panicked at|^--$|RUST_BACKTRACE" | head -40 | sed 's/^/::error::/'
          exit $status
