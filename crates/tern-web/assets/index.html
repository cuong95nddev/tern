<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Tern</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <button id="back" class="icon" title="All terminals" hidden>&#8249;</button>
  <div id="heading">
    <div id="title">Tern</div>
    <div id="subtitle"></div>
  </div>
  <div id="zoom" hidden>
    <button id="zoom-out" aria-label="Smaller text">A&#8722;</button>
    <button id="zoom-in" aria-label="Larger text">A+</button>
  </div>
  <span id="conn" class="dot" title="Connection"></span>
</header>

<main>
  <section id="list-view">
    <ul id="sessions"></ul>
    <p id="empty" class="note" hidden>No agents are running in Tern.</p>
  </section>

  <section id="pick-view" hidden>
    <p class="note">Pick an agent.</p>
  </section>

  <section id="term-view" hidden>
    <nav id="tabs" hidden></nav>
    <div id="term-wrap"><div id="term"></div></div>
    <div id="banner" hidden></div>
    <div id="control" hidden>
      <span id="control-text"></span>
      <button id="drive">Fit to Phone</button>
    </div>
    <div id="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button data-key="stab">&#8679;Tab</button>
      <button data-key="up">&#8593;</button>
      <button data-key="down">&#8595;</button>
      <button data-key="left">&#8592;</button>
      <button data-key="right">&#8594;</button>
      <button data-key="ctrlc">^C</button>
      <button data-key="enter">&#9166;</button>
    </div>
    <form id="compose" autocomplete="off">
      <textarea id="text" rows="1" placeholder="Message" enterkeyhint="send" spellcheck="true"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>

  <section id="message-view" hidden>
    <p id="message" class="note"></p>
  </section>
</main>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-unicode11.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/app.js"></script>
</body>
</html>
