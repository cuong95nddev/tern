[package]
name = "tern-menubar"
version.workspace = true
edition.workspace = true

[dependencies]
env_logger = "0.11.11"
libc = "0.2.190"
log = "0.4.34"
semver = "1"
tern-mux = { version = "0.1.0", path = "../tern-mux" }
tern-term = { version = "0.1.0", path = "../tern-term" }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAlert", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
