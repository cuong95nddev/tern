[package]
name = "tern-app"
version = "0.8.0"
edition.workspace = true

[build-dependencies]
embed-resource = "3.0"

[dependencies]
# Markdown preview: `data:` images, which an image resolver decodes itself.
data-url = "0.3"
dunce = "1"
env_logger = "0.11.11"
flume = "0.12.0"
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-rust", "tree-sitter-toml", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go", "tree-sitter-bash", "tree-sitter-yaml", "tree-sitter-css", "tree-sitter-html", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-swift", "tree-sitter-diff"] }
futures = "0.3"
global-hotkey = "0.8"
# Display and idle holds behind the title bar's cup; `bin` would pull in a CLI.
keepawake = { version = "0.6.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
ab_glyph = "0.2"
tiny-skia = "0.11"
libc = "0.2.190"
lsp-types = "0.97"
lyon_tessellation = "1"
log = "0.4.34"
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
streaming-iterator = "0.1"
# Go to definition: the grammars' tags queries (the same crates the editor highlights with).
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tern-bridge = { version = "0.1.0", path = "../tern-bridge" }
tern-fs = { version = "0.1.0", path = "../tern-fs" }
tern-menubar = { version = "0.8.0", path = "../tern-menubar" }
tern-mux = { path = "../tern-mux" }
tern-term = { version = "0.1.0", path = "../tern-term" }
tern-web = { path = "../tern-web" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
