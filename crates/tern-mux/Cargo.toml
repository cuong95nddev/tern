[package]
name = "tern-mux"
version = "0.1.0"
edition.workspace = true

[dependencies]
getrandom = "0.4.3"
log = "0.4.34"
lz4_flex = "0.11"
polling = "3.8"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
tern-bridge = { version = "0.1.0", path = "../tern-bridge" }
tern-term = { version = "0.1.0", path = "../tern-term" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
