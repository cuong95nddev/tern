[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.8.0"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: it made most of a debug target's size.
debug = false

# The terminal path (parsing, the mux, drawing frames) is too slow unoptimized
# to judge how a debug build feels; level 1 keeps builds quick.
[profile.dev.package.tern-term]
opt-level = 1

[profile.dev.package.tern-mux]
opt-level = 1

[profile.dev.package.tern-app]
opt-level = 1

# gpui's list dropped every item's height hint when its width changed, the
# first layout included, so off-screen rows counted as zero height and the
# diff view could not scroll past its first screen. The Metal and DirectX
# renderers added up alpha, so a see-through window turned opaque under a
# few layers. gpui-component's text view hid the base view's image resolver,
# so the Markdown preview could not show a note's own images. macOS
# notifications came without a sound. See
# vendor/README.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
gpui-component = { path = "vendor/gpui-component" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
